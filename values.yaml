replicaCount: 1

image:
  repository: n8nio/n8n
  tag: 1.123.36
  pullPolicy: IfNotPresent

runnerImage:
  repository: registry.registry.svc.cluster.local:5000/n8n-runner
  tag: 56
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 443

# This Secret is deliberately not rendered by Helm. Jenkins creates it from
# Vault before publishing a new runner image tag.
runtimeSecret:
  name: n8n-runtime

database:
  host: 192.168.1.44
  port: "5432"
  name: n8n_db
  user: n8n

aiTest:
  gatewayUrl: http://gateway.ai-test-system.svc.cluster.local:8080
  allowedRepositories: Luseramia/ai-orchestrator

jenkinsSecretManager:
  enabled: true
  serviceAccountName: kaniko
  serviceAccountNamespace: jenkins

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"  
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    acme.cert-manager.io/http01-ingress-class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-dns01"
  hosts:
    - host: n8n.tarchunk.win
      paths:
        - path: /
          pathType: Prefix
  tls:  
    - secretName: n8n-tls
      hosts:
        - n8n.tarchunk.win
        

persistence:
  enabled: true
  storageClassName: "truenas-nfs-storage"   # ใส่ storage class ที่ cluster คุณมี เช่น "local-path" หรือ "longhorn"
  accessModes:
    - ReadWriteOnce
  size: 5Gi

resources: {}
