apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}
spec:
  topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: n8n
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "n8n.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "n8n.name" . }}
      annotations:
        checksum/runner-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: n8n
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start"]
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_HOST
              # value: "0.0.0.0"
              value: "{{ (index .Values.ingress.hosts 0).host }}"
            - name: WEBHOOK_URL
              value: "https://{{ (index .Values.ingress.hosts 0).host }}/"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: n8n-encryption-key
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: DB_TYPE
              value: "postgresdb"
            - name: N8N_PROTOCOL
              value: "https"
            - name: DB_POSTGRESDB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_POSTGRESDB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_POSTGRESDB_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: DB_POSTGRESDB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: db-password
            - name:  N8N_PAYLOAD_SIZE_MAX
              value: "100"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: runners-auth-token
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            # - name: N8N_RUNNERS_EXTERNAL_ALLOW
            #   value: "talib,PIL,numpy"
            # - name: N8N_RUNNERS_STDLIB_ALLOW
            #   value: "json,sys"
            - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              value: "false"
            - name: N8N_RUNNERS_PYTHON_ENABLED  
              value: "true"
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            - name: AI_TEST_GATEWAY_URL
              value: {{ .Values.aiTest.gatewayUrl | quote }}
            - name: AI_TEST_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-gateway-token
            - name: AI_TEST_PLAN_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-plan-webhook-secret
            - name: AI_TEST_COMPLETION_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-completion-webhook-secret
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: github-webhook-secret
            - name: AI_TEST_ALLOWED_REPOSITORIES
              value: {{ .Values.aiTest.allowedRepositories | quote }}
            - name: AI_TEST_NOTIFICATION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-notification-url
            - name: AI_TEST_NOTIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-notification-token
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000 
        - name: n8n-runner
          image: "{{ .Values.runnerImage.repository }}:{{ .Values.runnerImage.tag }}"
          # command: ["sleep", "3600"]    
          imagePullPolicy: {{ .Values.runnerImage.pullPolicy }}
          env:
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: runners-auth-token
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://127.0.0.1:5679"
            - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
              value: "15"
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "300"
            - name: AI_TEST_PLAN_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-plan-webhook-secret
            - name: AI_TEST_COMPLETION_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: ai-test-completion-webhook-secret
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name | quote }}
                  key: github-webhook-secret
            - name: AI_TEST_ALLOWED_REPOSITORIES
              value: {{ .Values.aiTest.allowedRepositories | quote }}
          volumeMounts:
            - name: runner-config
              mountPath: /etc/n8n-task-runners.json
              subPath: n8n-task-runners.json
          securityContext:
            runAsUser: 0
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "n8n.fullname" . }}{{ end }}
        - name: runner-config
          configMap:
            name: n8n-runner-config
