{{- if .Values.jenkinsSecretManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-n8n-runtime-secret-manager
  namespace: {{ .Release.Namespace }}
rules:
  # Kubernetes cannot constrain create by resourceNames. Other write verbs are
  # restricted to the one externally managed Secret below.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.runtimeSecret.name | quote }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-n8n-runtime-secret-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jenkinsSecretManager.serviceAccountName | quote }}
    namespace: {{ .Values.jenkinsSecretManager.serviceAccountNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-n8n-runtime-secret-manager
{{- end }}
